<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#13243a" />
  <meta name="description" content="GDPからGNI・国民所得までを、図解・数値シミュレーション・確認問題で順番に学べるSNA学習サイト。" />
  <title>GDPからGNIへ | SNA Learning Lab</title>
  <style>
    :root{--navy:#13243a;--navy2:#1e3450;--paper:#f6f8f7;--ink:#14283b;--muted:#627285;--teal:#008a80;--mint:#e7f5f0;--sky:#e8f2fc;--coral:#f68d5d;--gold:#efbd56;--border:#dfe7e8;--white:#fff;--shadow:0 20px 60px rgba(19,36,58,.09);--radius:22px}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;font-size:16px;line-height:1.78}
    button,input,select{font:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
    a{color:var(--teal)}
    .layout{min-height:100vh;display:grid;grid-template-columns:306px minmax(0,1fr)}
    .sidebar{background:var(--navy);color:#edf7f8;min-height:100vh;padding:31px 22px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:auto}
    .brand{display:flex;align-items:center;gap:12px;padding:2px 10px 26px;border-bottom:1px solid #36516a}
    .brand-icon{height:41px;width:41px;border-radius:13px;background:linear-gradient(145deg,#67e1cb,#b5efe2);color:#13334b;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900}
    .brand-title{font-weight:900;letter-spacing:.04em;line-height:1.25;font-size:17px}
    .brand-sub{font-size:10px;color:#a6c8c8;letter-spacing:.2em;font-weight:800;margin-top:3px}
    .sidebar-info{padding:24px 10px 14px}
    .side-caption{font-size:11px;font-weight:900;letter-spacing:.15em;color:#9eb4c8}
    .side-big{font-size:23px;line-height:1.35;font-weight:900;letter-spacing:.02em;margin-top:8px}
    .progress-mini{margin:18px 0 10px;height:7px;border-radius:20px;background:#3b526b;overflow:hidden}
    .progress-mini >div{height:100%;width:10%;background:linear-gradient(90deg,#60c5b8,#aadfc9);transition:width .25s}
    .side-progress-label{font-size:12px;color:#b8c8d6}
    .nav-list{display:grid;gap:6px;margin:14px 0 20px}
    .nav-item{width:100%;border:1px solid transparent;color:#b6c7d7;border-radius:13px;background:transparent;text-align:left;display:flex;align-items:center;padding:12px 10px;gap:12px;transition:.2s}
    .nav-item:hover{background:#203a54}
    .nav-item.active{background:#e8f7f3;color:#15394a;font-weight:900}
    .nav-number{font-size:12px;flex:none;display:flex;align-items:center;justify-content:center;height:29px;width:29px;border-radius:9px;border:1px solid #526980;font-weight:800;color:#cce2e8}
    .nav-item.active .nav-number{border-color:#b8dfd6;color:#087468;background:#fff}
    .nav-item.visited:not(.active) .nav-number{color:#75e0d0;border-color:#549b96}
    .nav-label{font-size:12px;line-height:1.4}
    .nav-check{font-size:13px;margin-left:auto;color:#70d7c2}
    .sidebar-footer{margin-top:auto;border-top:1px solid #36516a;padding:20px 10px 4px;color:#9dafc3;font-size:11px}
    .main{min-width:0}
    .topbar{height:77px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,5vw,76px);background:#fdfefd}
    .topbar-left{display:flex;gap:10px;align-items:center;font-size:12px;letter-spacing:.16em;font-weight:900;color:#607789}
    .dot{height:8px;width:8px;background:var(--teal);border-radius:50%}
    .topbar-right{font-size:13px;color:var(--muted);font-weight:700}
    .topbar-right b{color:var(--ink)}
    .content{max-width:1160px;margin:0 auto;padding:48px clamp(20px,5vw,75px) 80px}
    .eyebrow{font-size:12px;font-weight:900;letter-spacing:.17em;text-transform:uppercase;color:var(--teal)}
    .headline{font-size:clamp(30px,3.6vw,49px);line-height:1.32;letter-spacing:-.05em;margin:12px 0 16px;font-weight:900}
    .lead{font-size:16px;color:#546878;max-width:790px;margin:0 0 29px;line-height:1.95}
    .lesson-meta{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
    .pill{font-size:11px;font-weight:800;color:#0c786e;border:1px solid #b6dfd5;background:#effaf7;border-radius:99px;padding:3px 11px}
    .pill.gray{background:#fff;border-color:#dfe8e9;color:#6c7c89}
    .hero-card{background:linear-gradient(134deg,#142b43,#24455b);color:#fff;border-radius:var(--radius);padding:clamp(24px,3vw,38px);margin-bottom:22px;position:relative;overflow:hidden}
    .hero-card::after{content:"";position:absolute;right:-50px;top:-105px;width:320px;height:320px;border-radius:50%;border:70px solid rgba(110,226,200,.09);pointer-events:none}
    .hero-kicker{font-size:11px;letter-spacing:.15em;font-weight:900;color:#8cdbd0}
    .hero-card h2{font-size:clamp(20px,2.1vw,28px);margin:7px 0 10px;line-height:1.45;position:relative;z-index:1}
    .hero-card p{margin:0;color:#c7d7e1;font-size:14px;position:relative;z-index:1;max-width:790px}
    .section-title{font-size:19px;font-weight:900;margin:35px 0 16px;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
    .section-title::before{content:"";width:5px;height:19px;background:var(--teal);border-radius:9px}
    .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
    .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
    .tile,.figure-card,.checkpoint,.sim-card,.formula-block,.note-card,.reference-card{border:1px solid var(--border);background:var(--white);border-radius:19px;box-shadow:0 5px 20px rgba(19,36,58,.025)}
    .tile{padding:22px}
    .tile-icon{font-size:29px;margin-bottom:10px;line-height:1.3}
    .tile h3{font-size:18px;margin:0 0 8px;font-weight:900}
    .tile p{color:var(--muted);font-size:13px;margin:0;line-height:1.8}
    .figure-card{padding:clamp(20px,3vw,30px)}
    .figure-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
    .figure-head h3{font-size:16px;margin:0;font-weight:900}
    .figure-head span{color:#8494a3;font-size:12px}
    .balance-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0 15px}
    .value-box{border:1px solid #dce7e9;border-radius:16px;padding:16px 20px;background:#f8fbfb;min-width:150px;flex:1}
    .value-box.focus{background:#e6f6f0;border-color:#a7d8c7}
    .value-box.blue{background:#edf5fb;border-color:#b8d8e9}
    .value-box.amber{background:#fff4e8;border-color:#f6d3af}
    .value-box .small{font-size:12px;font-weight:800;color:#597286}
    .value-box .big{font-size:28px;line-height:1.3;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
    .operator{font-size:26px;color:#8c9da7;font-weight:600}
    .segbar{display:flex;height:67px;overflow:hidden;border-radius:13px;background:#dfe8e8;min-width:0}
    .segment{display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:12px;font-weight:900;color:#fff;line-height:1.5;min-width:0;padding:5px 3px;text-align:center;border-right:2px solid #fff}
    .segment:last-child{border:0}
    .segment .n{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}
    .c1{background:#247a9b}.c2{background:#17a798}.c3{background:#f2ad63;color:#3f3427}.c4{background:#ad86b4}.c5{background:#697f94}.c6{background:#bf6f65}
    .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:12px}
    .legend div{display:flex;gap:6px;align-items:center}
    .swatch{width:10px;height:10px;border-radius:3px}
    .subtext{font-size:13px;color:#667c8a;margin-top:13px}
    .formula-block{padding:21px 24px;margin-top:16px}
    .formula-tag{font-size:11px;letter-spacing:.13em;font-weight:900;color:var(--teal)}
    .formula{font-size:clamp(17px,2.1vw,24px);font-weight:900;margin:8px 0 6px;line-height:1.65;letter-spacing:-.035em;overflow-wrap:anywhere}
    .formula-sub{color:var(--muted);font-size:13px;margin:0}
    .note-card{padding:20px 22px;background:#f0f9f6;border-color:#cfebe1;margin-top:16px}
    .note-title{color:#0f786e;font-size:13px;font-weight:900;margin-bottom:5px}
    .note-card p{margin:0;font-size:14px;color:#435e68}
    .checkpoint{margin-top:34px;padding:25px}
    .check-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
    .check-top .eyebrow{color:#c37846}
    .checkpoint h3{font-size:19px;margin:0 0 16px;font-weight:900}
    .choices{display:grid;gap:9px}
    .choice{width:100%;display:flex;align-items:center;gap:13px;padding:13px 16px;text-align:left;border:1px solid #dce5e7;border-radius:12px;background:#fff;color:#2c4153;font-weight:700;font-size:14px}
    .choice:hover{background:#f5fbf9;border-color:#b5d9d1}
    .choice.selected{border-color:#087a73;background:#edfaf5}
    .choice.correct{border-color:#24a382;background:#e8f8ee}
    .choice.wrong{border-color:#e08b71;background:#fff0ed}
    .choice-letter{width:27px;height:27px;border-radius:8px;background:#ecf1f2;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex:none}
    .feedback{padding:13px 15px;border-radius:12px;font-size:14px;margin-top:13px;display:none}
    .feedback.show{display:block}
    .feedback.good{background:#e6f7ee;color:#1c7056}
    .feedback.bad{background:#fff1ea;color:#945f3e}
    .pager{display:flex;justify-content:space-between;gap:12px;margin-top:31px}
    .btn{border:0;border-radius:12px;padding:14px 23px;font-weight:900;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:9px;line-height:1.35}
    .btn.primary{background:#0a8d80;color:#fff;box-shadow:0 8px 18px rgba(8,141,128,.16)}
    .btn.primary:hover{background:#047467}
    .btn.secondary{background:#fff;color:#254157;border:1px solid #dae5e6}
    .btn.secondary:hover{background:#f5faf9}
    .btn:disabled{opacity:.4;cursor:default}
    .step-list{display:grid;gap:9px}
    .step-item{display:flex;align-items:flex-start;gap:15px;border:1px solid #dfe8e9;border-radius:14px;padding:16px;background:#fff}
    .step-bullet{height:28px;width:28px;flex:none;display:flex;align-items:center;justify-content:center;background:#e3f6ef;border-radius:9px;color:#087d70;font-weight:900;font-size:12px}
    .step-item b{font-size:14px}
    .step-item p{margin:3px 0 0;font-size:13px;color:var(--muted)}
    .mini-label{font-size:12px;font-weight:900;color:#62788a;margin-bottom:5px}
    .sim-card{padding:clamp(18px,3vw,30px)}
    .slider-block{margin-bottom:21px}
    .slider-block label{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:800;margin-bottom:8px;align-items:center}
    .slider-block output{font-size:18px;font-weight:900;color:#0b8277;font-variant-numeric:tabular-nums}
    input[type=range]{width:100%;accent-color:#0c9485;cursor:pointer}
    .results{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .result-cell{border:1px solid #dbe7e7;background:#f8fcfb;padding:14px;border-radius:13px}
    .result-cell .label{font-size:11px;color:#6b7e8b;font-weight:800}
    .result-cell .num{font-size:24px;line-height:1.35;font-weight:900;font-variant-numeric:tabular-nums}
    .result-cell.accent{background:#e7f8f2;border-color:#addfcf}
    .quiz-intro{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:15px}
    .quiz-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
    .quiz-row{background:#fff;border:1px solid var(--border);padding:14px 15px;border-radius:13px}
    .quiz-row.correct{border-color:#71c6a8;background:#f2fbf5}
    .quiz-row.wrong{border-color:#efa089;background:#fff7f3}
    .quiz-row .quiz-label{font-size:12px;font-weight:900;color:#506578;margin-bottom:6px}
    .quiz-row select{width:100%;min-height:43px;background:#fff;border:1px solid #d2dee1;border-radius:9px;padding:7px 10px;font-size:13px;color:#304758}
    .quiz-explain{font-size:12px;color:#28725c;margin:8px 0 0}
    .quiz-explain.bad{color:#b16b50}
    .score-card{margin:16px 0;padding:20px;border-radius:16px;background:#e9f7f1;border:1px solid #b8e0d1;display:none}
    .score-card.show{display:block}
    .score-number{font-size:36px;font-weight:900;color:#08756a;line-height:1.1}
    .score-card p{margin:7px 0 0;font-size:13px}
    .original-picture{width:100%;max-width:660px;height:auto;max-height:700px;object-fit:contain;display:block;margin:0 auto;border:1px solid #dce5e7;border-radius:12px;background:#fff}
    details{border:1px solid #dae5e5;border-radius:14px;padding:15px 17px;background:#fff;margin-top:15px}
    summary{cursor:pointer;font-weight:900;font-size:14px}
    details p{margin-bottom:0;color:var(--muted);font-size:13px}
    .reference-card{margin-top:32px;padding:18px 21px}
    .reference-card h3{font-size:14px;margin:0 0 7px}
    .reference-card p,.reference-card li{font-size:12px;color:#667986;line-height:1.8}
    .reference-card ul{margin:8px 0;padding-left:21px}
    .reference-card a{word-break:break-all}
    .muted{color:var(--muted)}
    .formula-guide{margin:10px 0 0;font-size:13px;color:#526977}
    .chart-label{font-weight:900;font-size:13px;margin:9px 0 7px}
    .smallcaps{letter-spacing:.12em;text-transform:uppercase;font-size:11px;font-weight:900;color:#6c8f8b}
    .compare{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin:11px 0}
    .compare .value-box{min-width:0}
    .compare .operator{font-size:28px}
    .key-terms{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
    .term{background:#ecf4f5;border-radius:9px;padding:5px 11px;color:#456370;font-size:12px;font-weight:900}
    .zoom-btn{margin:13px auto 0;display:flex;align-items:center;gap:8px;border:1px solid #b8d8d2;background:#ebf8f4;color:#08766b;padding:9px 16px;border-radius:9px;font-weight:900;font-size:13px}
    .image-dialog{border:0;border-radius:18px;padding:0;width:min(94vw,1200px);max-width:1200px;max-height:94vh;background:#fff;box-shadow:0 24px 80px rgba(0,0,0,.3)}
    .image-dialog::backdrop{background:rgba(8,20,32,.82)}
    .dialog-toolbar{padding:13px 20px;display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid #dfe6e7;font-size:13px;font-weight:900}
    .dialog-scroll{max-height:calc(94vh - 65px);overflow:auto;text-align:center;padding:12px}
    .dialog-scroll img{display:block;width:100%;min-width:660px;height:auto;margin:auto}
    @media(max-width:1060px){.layout{grid-template-columns:250px minmax(0,1fr)}.sidebar{padding-left:13px;padding-right:13px}.content{padding-left:30px;padding-right:30px}}
    @media(max-width:800px){.layout{display:block}.sidebar{position:static;height:auto;min-height:0;padding:14px 18px 5px}.brand{border:0;padding:0 0 8px}.brand-icon{height:33px;width:33px;font-size:18px}.brand-title{font-size:14px}.sidebar-info,.sidebar-footer{display:none}.nav-list{display:flex;gap:7px;overflow-x:auto;margin:8px -5px 2px;padding:1px 5px 9px;scrollbar-width:thin}.nav-item{width:auto;white-space:nowrap;flex:none;padding:8px 10px;border:1px solid #36516a}.nav-label{font-size:11px}.nav-number{height:22px;width:22px;font-size:10px}.nav-check{display:none}.topbar{height:54px;padding:0 20px}.content{padding:29px 18px 50px}.grid3{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.quiz-grid{grid-template-columns:1fr}.headline{font-size:31px}.lead{font-size:14px}.tile{padding:18px}.hero-card{padding:23px}.segbar{height:72px}.segment{font-size:10px}.segment .n{font-size:15px}}
    @media(max-width:470px){.balance-row{gap:6px}.value-box{padding:12px;min-width:95px}.value-box .big{font-size:21px}.operator{font-size:19px}.compare{gap:7px}.compare .value-box{padding:9px}.compare .value-box .big{font-size:18px}.results{gap:7px}.result-cell{padding:11px}.result-cell .num{font-size:21px}.pager .btn{padding:12px 13px;font-size:12px}.figure-card,.checkpoint{padding:18px}}
    @media print{.sidebar,.topbar,.pager,.checkpoint,.reference-card{display:none!important}.layout{display:block}.content{padding:0;max-width:none}.figure-card,.tile,.formula-block{break-inside:avoid}body{background:#fff}}


    /* Original worksheet: progressive, lesson-linked diagram */
    .master-board{margin:24px 0 32px;background:#fff;border:1px solid #c8dce0;border-radius:21px;overflow:hidden;box-shadow:0 14px 34px rgba(14,48,69,.06)}
    .master-top{padding:22px 24px 18px;background:linear-gradient(113deg,#f0fbf7,#f1f6fd);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
    .master-eyebrow{color:#00847b;font-size:11px;font-weight:900;letter-spacing:.12em}
    .master-top h2{font-size:20px;line-height:1.4;font-weight:900;margin:4px 0 5px}
    .master-top p{font-size:12px;color:#556f7b;margin:0;max-width:690px}
    .master-count{background:white;border:1px solid #b7d9d2;padding:8px 13px;border-radius:13px;min-width:107px;text-align:center}
    .master-count strong{font-size:24px;color:#007e72;font-variant-numeric:tabular-nums;line-height:1}
    .master-count span{font-size:11px;color:#65808a;font-weight:800;margin-left:3px}
    .master-track{height:5px;background:#d9e9e9;overflow:hidden}
    .master-fill{background:linear-gradient(90deg,#13a698,#64d0ac);height:100%;transition:width .55s ease;width:0}
    .master-scroll{overflow-x:auto;overscroll-behavior-inline:contain;padding:18px 20px 11px;scrollbar-width:thin}
    .master-grid{min-width:695px;display:grid;gap:6px}
    .master-line{display:grid;grid-template-columns:137px minmax(0,1fr);gap:9px;align-items:stretch}
    .master-label{background:#f1f5f7;border:1px solid #d7e4e7;border-radius:9px;padding:9px 10px;font-size:12px;font-weight:900;line-height:1.55;display:flex;flex-direction:column;justify-content:center;gap:3px}
    .master-index{display:inline-flex;color:#087d76;font-size:13px}
    .master-label .blank-animate{font-size:11px}
    .master-area{display:flex;flex-direction:column;gap:4px;min-width:0}
    .master-band{display:flex;gap:3px;min-height:51px;min-width:0}
    .master-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-width:0;padding:7px 5px;border-radius:8px;border:1px solid #cddde2;background:#eff7fa;line-height:1.35;font-size:12px;font-weight:850}
    .master-cell.green{background:#e9f7f1;border-color:#bfe3d6}
    .master-cell.orange{background:#fff3e9;border-color:#f1d3bb}
    .master-cell.gray{background:#f4f7f8;border-color:#e0e8eb}
    .master-mini{min-height:26px;padding:2px 8px;border-left:3px solid #b2dcd3;color:#617680;font-size:11px;line-height:1.9;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
    .master-mini .blank-animate{font-size:10px}
    .master-fixed{color:#273f4d}
    .blank-animate{display:inline-block;vertical-align:baseline;max-width:100%;font-size:12px;font-weight:900;border-radius:6px;padding:2px 5px;white-space:normal;overflow-wrap:anywhere}
    .blank-animate.pending{color:#8497a0;background:#fff;border:1px dashed #adc4ca;min-width:29px}
    .blank-animate.revealed{background:#c6f4e3;color:#05685f;border:1px solid #56c7a6}
    .blank-animate.arriving{animation:inkDrop .8s cubic-bezier(.16,.95,.25,1.22) both}
    @keyframes inkDrop{0%{opacity:0;transform:translateY(-8px) scale(.94);filter:blur(4px);background:#ffe09e;box-shadow:0 0 0 5px rgba(255,194,93,.3)}50%{opacity:1;background:#fff0b4}100%{opacity:1;transform:none;filter:blur(0);background:#c6f4e3;box-shadow:0 0 0 0 rgba(255,194,93,0)}}
    .master-scroll-hint{display:none;color:#64808b;font-size:11px;font-weight:800;padding:0 17px 10px;text-align:center}

<script>
(()=>{
  'use strict';
  const steps=[
    {nav:'まず全体像',title:'GDPは、経済を3方向から見るための出発点',lead:'複雑な図も、まず「生産」「支出」「分配」の3つに分けるとわかりやすくなります。',goal:'GDPの「三面等価」を説明できる',check:{q:'同じ経済活動を「生産・支出・分配」の3方向から捉える考え方は？',options:['三面等価','比較優位','需要の価格弾力性'],answer:0,why:'同じ付加価値を、作った側・使った側・受け取った側から見ています。'}},
    {nav:'① 生産からGDPへ',title:'国内産出額から、中間投入を引くとGDP',lead:'パン屋が売ったパンの売上が、そのまますべて「新たに生み出した価値」になるわけではありません。',goal:'付加価値と中間投入の違いを説明できる',check:{q:'国内産出額1,600、原材料などの中間投入600ならGDPはいくら？',options:['2,200','1,000','600'],answer:1,why:'GDP＝国内産出額－中間投入＝1,600－600＝1,000です。'}},
    {nav:'② 支出からGDPへ',title:'買われた側から見れば「国内総支出」',lead:'国内で生み出した価値は、消費・投資・輸出などとして使われます。輸入した分は国内生産ではないので引きます。',goal:'純輸出＝輸出－輸入が使える',check:{q:'輸出170、輸入100のとき、純輸出はいくら？',options:['270','−70','70'],answer:2,why:'純輸出＝輸出－輸入＝170－100＝70です。'}},
    {nav:'③ 分配からGDPへ',title:'生み出した価値は、所得などに分かれる',lead:'GDPを分配側から見ると、働いた人の報酬、営業余剰、税・補助金の差額、固定資本減耗などに分かれます。',goal:'GDPの分配側の4要素を知る',check:{q:'次のうち、GDPの分配側の構成要素に含まれるのは？',options:['固定資本減耗','純輸出だけ','海外旅行の回数'],answer:0,why:'GDPは雇用者報酬＋営業余剰・混合所得＋純間接税＋固定資本減耗として捉えられます。'}},
    {nav:'④ 総から純へ',title:'「総」から設備の目減りを取り除く',lead:'工場や機械は使うと価値が目減りします。その分（固定資本減耗）をGDPから引くと、国内純生産NDPです。',goal:'GDP・NDPと市場価格・要素費用を区別できる',check:{q:'GDPが1,000、固定資本減耗が130のとき、国内純生産（市場価格）は？',options:['870','1,130','770'],answer:0,why:'NDP（市場価格）＝GDP－固定資本減耗＝870です。税の差額はまだ引きません。'}},
    {nav:'⑤ 国内から国民へ',title:'海外から受け取る所得と支払う所得の差を見る',lead:'「国内」は場所、「国民」は経済活動の拠点を置く居住者に注目します。海外との所得の受払で両者をつなぎます。',goal:'海外からの所得の純受取を計算できる',check:{q:'海外からの受取90、海外への支払35のとき、純受取は？',options:['125','55','−55'],answer:1,why:'海外からの所得の純受取＝受取－支払＝90－35＝55です。'}},
    {nav:'⑥ 国民所得 NI',title:'国民所得は、誰の所得になったかでも示せる',lead:'雇用者報酬・企業所得・非企業部門の財産所得という分け方に注目します。市場価格と要素費用の違いも整理しましょう。',goal:'国民所得（NI）の2つの表示を説明できる',check:{q:'NI（要素費用表示）825、純間接税100のとき、NI（市場価格表示）は？',options:['725','925','1,055'],answer:1,why:'要素費用表示から市場価格表示にする際は、純間接税を足します。825＋100＝925。'}},
    {nav:'⑦ GNI・GDI',title:'GDPに海外からの所得の純受取を加えるとGNI',lead:'最後は一番重要な関係式。GDPは国内で生まれた価値、GNIは居住者が得た所得を見る指標です。',goal:'GNI＝GDP＋海外からの所得の純受取を使える',check:{q:'GDP1,000、海外からの所得の純受取55ならGNIは？',options:['945','1,055','1,000'],answer:1,why:'GNI＝GDP＋海外からの所得の純受取＝1,055です。'}},
    {nav:'⑧ 数字で実験',title:'数値を動かすと、公式の意味が見えてくる',lead:'4つのスライダーを動かして、NDP・NI・GNIがどう変化するか確かめてください。',goal:'総・純／国内・国民／価格表示の変化を同時に追える',check:{q:'海外からの所得の純受取がマイナスなら、GNIとGDPはどうなる？',options:['GNIの方が小さい','必ず同じ','GNIの方が大きい'],answer:0,why:'GNI＝GDP＋純受取なので、純受取が負ならGNI＜GDPとなります。'}},
    {nav:'⑨ 元の図に挑戦',title:'元のプリント①〜⑰に答えよう',lead:'最後に、元のSNA概念図の空欄をすべて確認します。間違えたところを復習して、もう一度採点できます。',goal:'①〜⑰を自力で埋められる'}
  ];
  const termGlossaries=[[{"name":"SNA（国民経済計算）","short":"国全体の経済活動を記録する仕組み","expl":"企業・家計・政府・海外との取引を、共通のルールで整理する統計の体系です。","example":"国全体の「経済の家計簿」のようなもの。","role":"このプリント全体がSNAの指標のつながりを示しています。","row":null},{"name":"GDP（国内総生産）","short":"国内で新しく生まれた価値の合計","expl":"一定期間に国内で生産されたモノやサービスの「付加価値」を合計したものです。","example":"パンの売上100から仕入れ材料40を引くと、その段階で加えた価値は60。","role":"①生産・②支出・③分配から同じ経済活動を捉える中心の指標。","row":1},{"name":"GDE（国内総支出）","short":"国内で生み出した価値の使い道","expl":"消費や投資など、支出側から同じ経済活動を合計した額です。","example":"作ったパンが家庭やお店などに買われる場面に注目します。","role":"②の行を表す考え方。学習用の例ではGDPと同じ額になります。","row":2},{"name":"分配","short":"生まれた価値が誰に渡るか","expl":"新たに生み出した価値が、働く人や企業などの所得にどう分かれるかを見る視点です。","example":"パン代の一部は給料になり、一部は企業の営業余剰などになります。","role":"③の行の考え方です。","row":3},{"name":"三面等価","short":"生産・支出・分配は同じ経済を表す","expl":"どこで生まれたか・どう使われたか・誰に配分されたかを、別の方向から測る考え方です。","example":"１枚のパンを「作る→買う→売上を分ける」の３方向から眺めるイメージ。","role":"①②③が基本的に一致する理由です（実際の推計には統計上の不突合があります）。","row":null}],[{"name":"国内産出額","short":"国内で生産されたモノやサービスの総額","expl":"原材料から完成品まで、生産されたものの金額を集めたもの。材料の分が重なることもあります。","example":"小麦粉の生産額と、その小麦粉で作ったパンの生産額をそれぞれ数えます。","role":"①の大きな箱。ここから中間投入を引きます。","row":1},{"name":"中間投入","short":"生産に使い切った材料やサービス","expl":"別の企業から買って、生産の途中で使う原材料や電気、業務サービスなどの費用です。","example":"パン屋が仕入れた小麦粉・バターなど。","role":"①の右側。国内産出額から差し引く部分です。","row":1},{"name":"付加価値","short":"新しく付け加えた価値","expl":"生産額から中間投入を引いた額。材料を加工したりサービスを提供したりして生まれた価値です。","example":"パン100円、材料40円なら付加価値60円。","role":"GDPが集計する中心部分です。","row":1},{"name":"二重計算","short":"同じ材料分を何度も数えてしまうこと","expl":"途中の原材料も完成品もそのまま合算すると、材料の価値が重複します。","example":"小麦粉40円＋その小麦粉を使ったパン100円＝140円とすると材料を重複して数えます。","role":"中間投入を引く理由です。","row":1}],[{"name":"最終消費支出","short":"使うために買われたモノ・サービス","expl":"家庭や政府などが、生活や公共サービスのために消費した支出です。","example":"家庭が食べるパンや、政府が提供する行政サービスなど。","role":"②の「最終消費支出」の箱です。","row":2},{"name":"国内総資本形成","short":"将来の生産につながる投資など","expl":"工場の機械、建物、住宅、在庫の増減などをまとめた投資の項目です。","example":"パン屋が新しいオーブンを買ったり、売れ残ったパンが在庫になったりする場合。","role":"②の「国内総資本形成」の箱です。","row":2},{"name":"輸出","short":"国内で作ったものなどを海外に売る","expl":"国内で生産されたモノやサービスのうち、海外向けに販売された額です。","example":"日本で製造した製品を海外の顧客が購入。","role":"図の（2）。純輸出を求めるときの「足す側」です。","row":2},{"name":"輸入","short":"海外で作られたものなどを国内で買う","expl":"海外で生産されたモノやサービスを購入することです。","example":"海外で作られた商品を日本の家庭が購入。","role":"図の（3）。国内で生み出した価値ではないので「引く側」です。","row":2},{"name":"純輸出","short":"輸出から輸入を引いた差","expl":"「純」は差し引き後という意味。輸出が多ければプラス、輸入が多ければマイナスになります。","example":"輸出170、輸入100なら純輸出70。","role":"図の（1）。最終消費支出・投資と合わせてGDEを作ります。","row":2},{"name":"GDE（国内総支出）","short":"消費＋投資＋純輸出","expl":"国内で新しく生産された価値を、支出面から表す見方です。","example":"消費620＋投資310＋純輸出70＝1,000。","role":"②の行の合計は、名目GDPと概念上対応します。","row":2}],[{"name":"雇用者報酬","short":"働く人が仕事の対価として受け取るもの","expl":"賃金・賞与だけでなく、雇用主が負担する社会保険料なども含む概念です。","example":"店員の給料や、雇用主負担の社会保険料。","role":"③の「国内要素所得」に含まれます。","row":3},{"name":"営業余剰・混合所得","short":"事業の活動から生まれる所得","expl":"企業の営業余剰や、自営業者の労働と事業収益を分けにくい混合所得などです。","example":"パン屋の売上から材料費・人件費等を差し引いて残る事業の所得の部分。","role":"③の国内要素所得の構成要素です。","row":3},{"name":"国内要素所得","short":"労働や事業活動へ分配される所得","expl":"国内で生産要素を提供した人・企業への報酬をまとめた部分です。","example":"従業員への報酬＋企業などの営業余剰・混合所得。","role":"③の一番左の大きな箱に当たります。","row":3},{"name":"生産・輸入品に課される税","short":"生産や輸入などに関連して課される税","expl":"消費税など、モノやサービスの生産・輸入に関連する税です。","example":"お店の商品の値段に含まれる消費税など。","role":"③の（4）。純間接税を計算するときの「足す側」。","row":3},{"name":"補助金","short":"政府などが生産者に支給するお金","expl":"一定の政策目的に沿い、企業などの生産活動に対して支払われるものです。","example":"商品の生産コストを支えるため政府が支給する補助金。","role":"③の（5）。税から差し引く側です。","row":3},{"name":"純間接税","short":"税から補助金を差し引いた額","expl":"この教材では「生産・輸入品に課される税 − 補助金」の略称として使っています。","example":"税120、補助金20なら純間接税100。","role":"③の細い箱。市場価格表示と要素費用表示を切り替える鍵です。","row":3},{"name":"固定資本減耗","short":"設備が使われる・古くなることで減る価値","expl":"機械や建物などの固定資産が、生産に伴う使用や経年などで失う価値を推計した額です。","example":"パン屋のオーブンが毎年少しずつ古くなるイメージ。","role":"③の右端。GDP（総）からNDP（純）にするときに引きます。","row":3}],[{"name":"「総」と「純」","short":"固定資本減耗を含むかどうか","expl":"「総」は設備の目減りを含む計算、「純」はそこから目減り分を差し引いた計算です。","example":"GDP 1,000、固定資本減耗130 → NDP 870。","role":"③から④に進むときの変化です。","row":4},{"name":"国内純生産（NDP）","short":"GDPから設備の目減りを引いたもの","expl":"Net Domestic Product の略。国内で新たに生まれた価値から固定資本減耗を控除します。","example":"GDPが1,000なら、減耗130を引いてNDPは870。","role":"④の（6）。上段と下段は評価方法が違います。","row":4},{"name":"市場価格表示","short":"税・補助金の差を含んだ価格で表す","expl":"モノやサービスが市場で取引される価格に近い評価方法。生産・輸入品に課される税から補助金を差し引いた分を含みます。","example":"NDP 870 のうち純間接税が100なら、この870が市場価格表示。","role":"④の（7）。上段の表示方法です。","row":4},{"name":"要素費用表示","short":"税・補助金の差を除いて表す","expl":"生産を支える労働や資本などへの報酬に注目した評価方法です。","example":"NDP（市場価格）870－純間接税100＝770。","role":"④の（8）。下段の表示方法です。","row":4},{"name":"純間接税","short":"市場価格と要素費用をつなぐ差","expl":"生産・輸入品に課される税から補助金を差し引いた額です。","example":"純間接税100なら、市場価格表示から100を引くと要素費用表示になります。","role":"④の2段の間をつなぎます。","row":4}],[{"name":"国内と国民","short":"「場所」で数えるか「居住者」で数えるか","expl":"「国内」は国境の内側の生産、「国民」はその国に経済活動の拠点を置く居住者の所得に注目します。国籍だけでは決まりません。","example":"日本の居住者が海外から受け取る利子は、国内生産ではなく国民側の所得に関係します。","role":"④→⑤で国内から国民の概念に切り替わります。","row":5},{"name":"海外からの所得の受取","short":"海外から国内の居住者へ入る所得","expl":"海外に保有する資産から得る利子・配当、海外からの雇用者報酬などの第一次所得です。","example":"国内の居住者が海外への投資から配当を受け取る。","role":"図の（12）。純受取を計算するときの「足す側」です。","row":5},{"name":"海外への所得の支払","short":"海外の居住者へ渡る所得","expl":"国内から海外の居住者へ支払う利子・配当や雇用者報酬などです。","example":"海外の投資家へ日本企業が配当を支払う。","role":"図の（13）。純受取を計算するときの「引く側」です。","row":5},{"name":"海外からの所得の純受取","short":"受取 − 支払の差額","expl":"海外との第一次所得の受払を差し引いたもの。輸出入の差である「純輸出」とは別です。","example":"海外から90受け取り、35支払えば純受取55。","role":"図の（9）。国内の指標を国民の指標に変える際に足します。","row":5},{"name":"国民純生産（NNP）","short":"国民が得た純額の所得を表す指標","expl":"Net National Product の略。国内純生産に海外からの所得の純受取を加えます。","example":"NDP（要素費用）770＋純受取55＝NNP（要素費用）825。","role":"⑤の（10）。（11）は要素費用表示です。","row":5},{"name":"純輸出と所得の純受取の違い","short":"商品・サービスの取引か、所得の受払か","expl":"純輸出は輸出−輸入。所得の純受取は海外との利子・配当・雇用者報酬などの受取−支払です。","example":"海外へ製品を売るのは輸出、海外の株式から配当を得るのは所得の受取。","role":"②の（1）と⑤の（9）を混同しないことが重要です。","row":5}],[{"name":"国民所得（NI）","short":"居住者が生産に関わって得た所得","expl":"National Incomeの略。この教材では、要素費用表示と市場価格表示の両方を扱います。","example":"働く人への報酬や企業の所得などを合わせて捉えます。","role":"⑥と⑦の2つの行に登場します。","row":6},{"name":"雇用者報酬","short":"働いた人が受け取る報酬","expl":"賃金・賞与に加え、雇用主が負担する社会保険料等も含みます。","example":"会社員の給料や雇用主負担の社会保険料。","role":"⑥の左の箱です。","row":6},{"name":"企業所得","short":"事業活動などから企業に帰属する所得","expl":"営業余剰・混合所得に受取・支払の財産所得を調整した企業の所得。売上そのものではありません。","example":"売上が1,000万円でも、経費などを引いた所得は同じ額になりません。","role":"⑥の中央の箱です。","row":6},{"name":"財産所得（非企業）","short":"企業以外の部門が得る財産からの所得","expl":"家計など企業以外の部門に帰属する利子・配当などの財産所得です。","example":"家計が預金の利子や株式配当を受け取る。","role":"⑥の右の箱です。","row":6},{"name":"NI（要素費用表示）","short":"労働や資本に分配された所得の合計","expl":"雇用者報酬・企業所得・非企業部門の財産所得を合計して示します。","example":"この教材の架空例では550＋220＋55＝825。","role":"⑥の（14）。⑤のNNP（要素費用）と同じ額になります。","row":6},{"name":"NI（市場価格表示）","short":"要素費用表示に純間接税を足したもの","expl":"税・補助金の差を含む形で評価した国民所得です。","example":"NI（要素費用）825＋純間接税100＝925。","role":"⑦の（15）。⑥から⑦に進むときに純間接税を加えます。","row":7}],[{"name":"GDP（国内総生産）","short":"国内で生まれた付加価値","expl":"生産場所を国内に限り、一定期間に新しく生まれた価値を合計します。","example":"日本国内の工場で生産された製品の付加価値。","role":"①〜③で表される国内ベースの指標です。","row":1},{"name":"GDI（国内総所得）","short":"GDPを所得側から表したもの","expl":"Gross Domestic Incomeの略。名目値では、概念上GDPと一致します。","example":"国内で生み出した1,000の価値を、所得側から見ても1,000と数える。","role":"⑧の（17）。","row":8},{"name":"GNI（国民総所得）","short":"居住者が受け取った総所得","expl":"Gross National Incomeの略。GDPに海外からの所得の純受取を加えた指標です。","example":"GDP 1,000、海外からの純受取55ならGNI 1,055。","role":"⑧の（16）。","row":8},{"name":"「国内」と「国民」","short":"海外との所得の受払で切り替わる","expl":"国内GDP/GDIと国民GNIをつなぐのは、海外からの所得の純受取です。","example":"国外からの所得が支払より多ければGNIはGDPより大きくなります。","role":"⑧の左の（9）の領域が差になります。","row":8},{"name":"「総」と「純」","short":"固定資本減耗を引くかどうか","expl":"GNIから固定資本減耗を引いた額が国民所得（市場価格表示）です。","example":"GNI 1,055－固定資本減耗130＝NI（市場価格）925。","role":"④・⑥・⑦と⑧の値をつなぎます。","row":8}],[{"name":"GDP","short":"最初の出発点となる額","expl":"国内で新たに生まれた付加価値の合計です。","example":"GDPが1,000なら、これが全計算のスタート。","role":"シミュレーターで最初に動かす数値です。","row":1},{"name":"固定資本減耗","short":"総→純で引くもの","expl":"生産設備などの使用や経年に伴う価値の目減り。","example":"1,000から130を引くとNDP（市場価格）は870。","role":"③の右端から④へ。","row":3},{"name":"純間接税","short":"市場価格→要素費用で引くもの","expl":"生産・輸入品に課される税から補助金を引いたものです。","example":"870から100を引くとNDP（要素費用）は770。","role":"③から④の表示方法を変える部分。","row":4},{"name":"海外からの所得の純受取","short":"国内→国民で足すもの","expl":"海外からの第一次所得の受取と支払の差です。プラスにもマイナスにもなります。","example":"GDP1,000、純受取＋55ならGNIは1,055。","role":"⑤の（9）、⑧の左側。","row":5},{"name":"NDP（国内純生産）","short":"GDP − 固定資本減耗","expl":"国内で生まれた価値から、設備の目減りを除いたものです。","example":"1,000−130＝870（市場価格表示）。","role":"④の（6）。","row":4},{"name":"NI（国民所得）","short":"国民に分配される所得","expl":"要素費用表示ならGDP−固定資本減耗−純間接税＋海外からの所得の純受取。","example":"1,000−130−100＋55＝825。","role":"⑥と⑦。","row":6},{"name":"GNI（国民総所得）","short":"GDP ＋ 海外からの所得の純受取","expl":"国内の生産に海外との所得差額を加えて、居住者の総所得を示します。","example":"1,000＋55＝1,055。","role":"⑧の（16）。","row":8}],[{"name":"純輸出","short":"輸出 − 輸入","expl":"国内で作ったものの対外的な売買の差額。","example":"海外への売上170－海外からの購入100＝70。","role":"②の（1）。","row":2},{"name":"純間接税","short":"生産・輸入品に課される税 − 補助金","expl":"市場価格表示と要素費用表示をつなぐ差額。","example":"税120－補助金20＝100。","role":"③の（4）と（5）。","row":3},{"name":"国内純生産（NDP）","short":"GDP − 固定資本減耗","expl":"「総」から機械・建物などの価値の目減りを引いた額。","example":"1,000－130＝870。","role":"④の（6）。","row":4},{"name":"海外からの所得の純受取","short":"海外からの所得の受取 − 海外への所得の支払","expl":"国内の経済活動と居住者の所得の差を調整する値。","example":"90－35＝55。","role":"⑤の（9）（12）（13）。","row":5},{"name":"国民純生産（NNP）","short":"国内純生産＋海外からの所得の純受取","expl":"国内の「純」の額を国民の「純」の額に切り替える指標です。","example":"770＋55＝825（要素費用表示）。","role":"⑤の（10）。","row":5},{"name":"国民所得（NI）","short":"居住者の所得を要素費用・市場価格で捉える","expl":"要素費用表示では雇用者報酬などの合計。市場価格表示にするには純間接税を加えます。","example":"825＋100＝925（市場価格表示）。","role":"⑥と⑦。","row":6},{"name":"国民総所得（GNI）","short":"GDP ＋ 海外からの所得の純受取","expl":"国内から国民へ切り替えた「総」の所得です。","example":"1,000＋55＝1,055。","role":"⑧の（16）。","row":8},{"name":"国内総所得（GDI）","short":"国内で生み出した価値を所得側から表したもの","expl":"名目値では理論上GDPと一致します。","example":"国内GDP1,000なら国内GDIも1,000という考え方。","role":"⑧の（17）。","row":8}]];
  const termInsights=["まず「どこで生まれたか（生産）→どう使われたか（支出）→誰の所得になったか（分配）」の３つで分類しよう。","パン屋の例で「生産額−中間投入＝付加価値」を説明できればOK。","輸出と輸入の差「純輸出」と、⑤の海外との「所得の純受取」は別のもの。","「税−補助金＝純間接税」と「設備の目減り＝固定資本減耗」を区別しよう。","総→純は減耗を引く。市場価格→要素費用は純間接税を引く。","国内→国民にするときは「海外からの所得の純受取」を加える。","NIは「誰の所得になったか」という分配の内訳でも理解できる。","GDPとGNIの差は海外からの所得の純受取。GNIは総、NIは純という違いもある。","スライダーを１つだけ動かし、変わる指標と変わらない指標を比べよう。","解き終わったら「なぜ足すのか／引くのか」を言葉で説明してみよう。"];

      <h2 class="section-title">①〜⑰の空欄を埋めよう</h2>
      <div class="quiz-grid">${blanks.map(b=>`<div class="quiz-row" id="row-${b.id}"><div class="quiz-label">（${b.id}） ${b.label}</div><select id="blank-${b.id}" data-blank="${b.id}" aria-label="空欄 ${b.id}"><option value="">選択してください</option>${b.options.map(o=>`<option value="${o}" ${state.blanks[b.id]===o?'selected':''}>${o}</option>`).join('')}</select><div class="quiz-explain" id="explain-${b.id}"></div></div>`).join('')}</div>
      <div class="score-card" id="scoreCard" role="status" aria-live="polite"><div class="score-number" id="scoreNum"></div><p id="scoreText"></p></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:17px"><button class="btn primary" id="gradeQuiz">17問を採点する →</button><button class="btn secondary" id="toggleSolutions">答えと解説を表示</button><button class="btn secondary" id="resetQuiz">回答をリセット</button></div>
      ${note('ゴール','①〜⑰が埋められたら、各指標の名前だけでなく「どの数字を足す／引くと変わるか」を自分の言葉で説明してみよう。')}`;
    return '';
  }

  // ①〜⑰を、元のプリントと同じ関係で段階的に表示する。
  // quizでは採点するまで解答を隠す。
  const diagramSequence=[1,2,3,4,5,6,7,8,9,12,13,10,11,14,15,16,17];
  const diagramStepCounts=[0,0,3,5,8,13,15,17,17,17];
  const diagramAnswers={
    1:'純輸出',2:'輸出',3:'輸入',4:'生産・輸入品に課される税',5:'補助金',
    6:'国内純生産（NDP）',7:'市場価格',8:'要素費用',9:'海外からの所得の純受取',
    10:'国民純生産（NNP）',11:'要素費用',12:'海外からの所得の受取',
    13:'海外への所得の支払',14:'要素費用',15:'市場価格',
    16:'国民総所得（GNI）',17:'国内総所得（GDI）'
  };
  let diagramManual=null;
  let diagramTimer=null;
  let diagramLatestId=null;
  function stopDiagram(){if(diagramTimer!==null){clearInterval(diagramTimer);diagramTimer=null}}
  function diagramCount(i){
    if(i===9&&!state.graded&&!state.showSolutions)return 0;
    if(diagramManual!==null)return diagramManual;
    return diagramStepCounts[i];
  }
  function diagramToken(id, count, fresh){
    const revealed=diagramSequence.indexOf(id)<count;
    const here=fresh.includes(id);
    const delay=Math.max(0,fresh.indexOf(id))*185;
    return `<span class="blank-animate ${revealed?'revealed':'pending'} ${revealed&&here?'arriving':''}" style="${revealed&&here?'animation-delay:'+delay+'ms':''}" aria-label="空欄${id}${revealed?' '+diagramAnswers[id]:' 未表示'}">${revealed?diagramAnswers[id]:'（'+id+'）'}</span>`;
  }
  function masterChart(i){
    const count=diagramCount(i);
    const isQuizHidden=i===9&&!state.graded&&!state.showSolutions;
    const prevCount=i>0?diagramStepCounts[i-1]:0;
    const fresh=diagramManual!==null?(diagramLatestId?[diagramLatestId]:[]):(i===9?(isQuizHidden?[]:diagramSequence):diagramSequence.slice(prevCount,count));
    const t=id=>diagramToken(id,count,fresh);
    const label=(id,txt)=>`<div class="master-label"><span class="master-index">${id}</span>${txt}</div>`;
    const cell=(body,klass='',width=1)=>`<div class="master-cell ${klass}" style="flex:${width}">${body}</div>`;
    const line=(n,txt,bands,mini='')=>`<div class="master-line ${i===n?'current-line':''}" data-row="${n}">${label(''+(n===8?'⑧':['','①','②','③','④','⑤','⑥','⑦'][n]),txt)}<div class="master-area">${bands}${mini?`<div class="master-mini">${mini}</div>`:''}</div></div>`;
    const band=parts=>`<div class="master-band">${parts}</div>`;
    const sheet=`
      ${line(1,'国内産出額',band(cell('国内総生産（GDP）','green',4)+cell('中間投入額','gray',1)),'国内産出額 ＝ GDP ＋ 中間投入')}
      ${line(2,'国内総支出（GDE）',band(cell('最終消費支出','',3)+cell('国内総資本形成','',3)+cell(t(1),'green',2)),`${t(1)} ＝ ${t(2)} − ${t(3)}`)}
      ${line(3,'国内総生産（GDP）',band(cell('国内要素所得<br><small>（雇用者報酬 ＋ 営業余剰）</small>','',5)+cell('純間接税','orange',1.3)+cell('固定資本減耗','gray',1.3)),`純間接税 ＝ ${t(4)} − ${t(5)}`)}
      ${line(4,t(6),band(cell(`${t(6)}<small>（${t(7)}表示）</small>`,'green',6)+cell('純間接税','orange',1.3))+band(cell(`${t(6)}<small>（${t(8)}表示）</small>`,'green',6)),'GDP − 固定資本減耗 ＝ NDP（市場価格） ／ さらに純間接税を引く ＝ NDP（要素費用）')}
      ${line(5,`${t(10)}<small>（${t(11)}表示）</small>`,band(cell(t(9),'orange',1.4)+cell(`${t(6)}<small>（${t(8)}表示）</small>`,'green',5)),`${t(9)} ＝ ${t(12)} − ${t(13)}`)}
      ${line(6,`国民所得（NI）<small>（${t(14)}表示）</small>`,band(cell('雇用者報酬','',2)+cell('企業所得','',2)+cell('財産所得（非企業）','',2)),'NI（要素費用）＝ NNP（要素費用）')}
      ${line(7,`国民所得（NI）<small>（${t(15)}表示）</small>`,band(cell('NI（要素費用表示）','green',5)+cell('純間接税','orange',1.3)),'NI（市場価格）＝ NI（要素費用）＋ 純間接税')}
      ${line(8,t(16),band(cell(t(9),'orange',1.4)+cell(t(17),'green',5)),'GNI ＝ GDI ＋ 海外からの所得の純受取')}
    `;
    let controls='';
    if(isQuizHidden){
      controls=`<div class="master-privacy">🔒 演習中は答えが見えません。17問の「採点する」または「答えと解説を表示」を押すと、完成した図が現れます。</div>`;
    }else{
      controls=`<button type="button" data-chart="prev" ${count===0?'disabled':''} aria-label="図の空欄を1個戻す">← 1つ戻す</button>
        <button type="button" class="emph" data-chart="next" ${count===17?'disabled':''}>＋ 1つ埋める</button>
        <button type="button" data-chart="play">${diagramTimer!==null?'Ⅱ 停止':'▶ 自動で埋める'}</button>
        <button type="button" data-chart="lesson">↩ 学習ステップに合わせる</button>
        <span class="master-hint">${diagramManual===null?'学習の進行に合わせて自動表示':'手動操作中（ステップの進行には影響しません）'}</span>`;
    }
    return `<section class="master-board" id="masterChartHost" aria-labelledby="masterChartTitle">
      <div class="master-top"><div><div class="master-eyebrow">ORIGINAL WORKSHEET / インタラクティブ図解</div><h2 id="masterChartTitle">学ぶたびに完成する、SNAの表</h2><p>元のプリントの①〜⑰に対応。緑色になった部分が新しくわかった項目です。</p></div><div class="master-count"><strong>${count}</strong><span>/ 17 空欄</span></div></div>
      <div class="master-track" role="progressbar" aria-valuemin="0" aria-valuemax="17" aria-valuenow="${count}" aria-label="図解の完成度"><div class="master-fill" style="width:${100*count/17}%"></div></div>
      <div class="master-scroll" tabindex="0" aria-label="SNAの図（横スクロールできます）"><div class="master-grid">${sheet}</div></div>
      <div class="master-scroll-hint">← 表は左右にスクロールできます →</div>
      <div class="master-actions">${controls}</div>
    </section>`;
  }
  function updateMasterChart(){
    const existing=document.getElementById('masterChartHost');
    if(existing)existing.outerHTML=masterChart(state.current);
  }
  function changeDiagram(next){
    diagramManual=Math.min(17,Math.max(0,next));
    diagramLatestId=diagramManual>0?diagramSequence[diagramManual-1]:null;
    updateMasterChart();
  }
  function diagramAction(action){
    if(state.current===9&&!state.graded&&!state.showSolutions)return;
    if(action==='lesson'){
      stopDiagram();diagramManual=null;diagramLatestId=null;updateMasterChart();return;
    }
    if(action==='play'){
      if(diagramTimer!==null){stopDiagram();updateMasterChart();return}
      const current=diagramCount(state.current);
      if(current===17)changeDiagram(0);else if(diagramManual===null)changeDiagram(current);
      diagramTimer=setInterval(()=>{
        const next=(diagramManual===null?0:diagramManual)+1;
        if(next>17){stopDiagram();updateMasterChart();return}
        changeDiagram(next);
        if(next===17){stopDiagram();updateMasterChart()}
      },850);
      updateMasterChart();return;
    }
    stopDiagram();
    changeDiagram(diagramCount(state.current)+(action==='next'?1:-1));
  }

  function checkpoint(i){const q=steps[i].check;if(!q)return '';
    const a=state.answers[i];
    return `<section class="checkpoint"><div class="check-top"><div class="eyebrow">CHECKPOINT / 理解度チェック</div><span class="pill gray">1問・選択式</span></div><h3>${q.q}</h3><div class="choices">${q.options.map((op,j)=>{const selected=a===j;const cls=a===undefined?'':(j===q.answer&&selected?'correct':selected?'wrong':j===q.answer?'':'');return `<button type="button" class="choice ${selected?'selected':''} ${cls}" data-choice="${j}" aria-pressed="${selected}"><span class="choice-letter">${String.fromCharCode(65+j)}</span>${op}</button>`}).join('')}</div><div id="answerFeedback" role="status" aria-live="polite" class="feedback ${a===undefined?'':a===q.answer?'show good':'show bad'}">${a===undefined?'':a===q.answer?'✓ 正解！ ':'もう一度考えてみよう。 '}${a!==undefined?q.why:''}</div></section>`;
  }
  function escapeTerm(s){return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function termGlossary(i){
    // The last worksheet quiz deliberately hides its detailed glossary until grading.
    if(i===9&&!state.graded&&!state.showSolutions){
      return `<section class="wordbook" id="wordbook"><div class="wordbook-heading"><span class="wordbook-mark">📖</span><div><div class="wordbook-eyebrow">WORDS TO REVIEW</div><h2>このページの用語解説</h2><p>①〜⑰の答えに直結する説明は、採点後に表示します。解く前は、これまでの学習ページで確認できます。</p></div></div><div class="wordbook-locked">🔐 <strong>今は自力で考える時間。</strong> 17問の採点後、すべての重要語句を例つきで復習できます。</div></section>`;
    }
    const terms=termGlossaries[i];
    return `<section class="wordbook" id="wordbook" aria-labelledby="wordbookTitle"><div class="wordbook-heading"><span class="wordbook-mark">📖</span><div><div class="wordbook-eyebrow">KEYWORDS / このページのことば</div><h2 id="wordbookTitle">用語をやさしく解説</h2><p>このステップに出てきた言葉を、ひとことで・具体例で・図の場所で理解しよう。</p></div><span class="wordbook-total">${terms.length}語</span></div><div class="wordbook-grid">${terms.map((w,j)=>`<article class="word-card"><div class="word-card-top"><span class="word-num">${String(j+1).padStart(2,'0')}</span><h3>${escapeTerm(w.name)}</h3></div><div class="word-short">${escapeTerm(w.short)}</div><p class="word-expl">${escapeTerm(w.expl)}</p><div class="word-example"><span>🍞 身近な例</span><p>${escapeTerm(w.example)}</p></div><div class="word-card-foot"><div><span>↳ この図では</span><p>${escapeTerm(w.role)}</p></div>${w.row?`<button type="button" class="word-find" data-term-row="${w.row}" aria-label="SNAの図の${w.row}行目を見る">図の行を見る ↗</button>`:''}</div></article>`).join('')}</div><div class="wordbook-takeaway"><span>💡 覚える一文</span><strong>${escapeTerm(termInsights[i])}</strong></div></section>`;
  }
  function updateTermGlossary(){const current=document.getElementById('wordbook');if(current)current.outerHTML=termGlossary(state.current);}
  function sourceBlock(){return `<div class="reference-card"><h3>参考資料・前提</h3><p>説明は内閣府などのSNA解説を参照し、学習用に単純化しています。例示数値はすべて架空。名目値で統計上の不突合を0と仮定しています。</p><ul>${referenceLinks.map(([t,url])=>`<li><a href="${url}" target="_blank" rel="noopener noreferrer">${t}</a></li>`).join('')}</ul></div>`}
  function renderNav(){
    nav.innerHTML=steps.map((s,i)=>`<button type="button" class="nav-item ${i===state.current?'active':''} ${state.visited.includes(i)?'visited':''}" data-step="${i}" ${i===state.current?'aria-current="step"':''}><span class="nav-number">${String(i).padStart(2,'0')}</span><span class="nav-label">${s.nav}</span>${s.check && state.answers[i]===s.check.answer?'<span class="nav-check">✓</span>':''}</button>`).join('');
    const count=new Set(state.visited).size;
    document.getElementById('sideProgressBar').style.width=`${count/steps.length*100}%`;
    document.getElementById('sideProgressText').textContent=`${count} / ${steps.length} ステップを閲覧`;
  }
  function render(){
    let i=state.current;if(i<0||i>=steps.length)i=0;state.current=i;
    if(!state.visited.includes(i))state.visited.push(i);
    const s=steps[i];document.title=`${s.nav} | SNA Learning Lab`;
    document.getElementById('stepCount').textContent=`${String(i+1).padStart(2,'0')} / 10`;
    content.innerHTML=`<div class="lesson-meta"><span class="eyebrow">STEP ${String(i).padStart(2,'0')} / 09</span><span class="pill">学習目標：${s.goal}</span></div><h1 class="headline">${s.title}</h1><p class="lead">${s.lead}</p><div class="hero-card"><div class="hero-kicker">TODAY'S BIG IDEA</div><h2>${['経済は「作る・使う・受け取る」でつながる','GDPが数えるのは、売上ではなく付加価値','輸入を引くから「国内」の支出がわかる','GDPは労働・企業・税・設備の目減りに分かれる','「総」と「純」は固定資本減耗の差','「国内」と「国民」は海外との所得の受払の差','市場価格表示と要素費用表示は税・補助金の差','GNI ＝ GDP ＋ 海外からの所得の純受取','数字を動かせば関係性が見える','図の17個の空欄を、理由つきで答えられる'][i]}</h2><p>${['まずは見取り図を手に入れよう。','材料を別の会社から買ったなら、二重計算しない。','消費＋投資＋（輸出−輸入）。','分配側から見てもGDPは同じ。','減耗を引いてNDPへ。純間接税を引いて要素費用へ。','純受取＝海外からの受取−海外への支払。','NI（要素費用）とNI（市場価格）を行き来できる。','ここまでの知識を一本の公式につなぐ。','スライダーを動かし、変わる指標と変わらない指標を観察。','必要なら前のステップに戻って、もう一度挑戦。'][i]}</p></div>${masterChart(i)}${visual(i)}${termGlossary(i)}${checkpoint(i)}<div class="pager"><button type="button" class="btn secondary" id="prevStep" ${i===0?'disabled':''}>← 前のステップ</button><button type="button" class="btn primary" id="nextStep">${i===steps.length-1?'最初から復習 ↺':'次のステップへ →'}</button></div>${sourceBlock()}`;
    renderNav();if(i===8)updateSimulator();if(i===9){if(state.graded)gradeQuiz(false);else if(state.showSolutions)showSolutions();}
    save();
  }
  function go(i){stopDiagram();diagramManual=null;diagramLatestId=null;state.current=Math.max(0,Math.min(steps.length-1,i));render();window.scrollTo({top:0,behavior:'instant'});const active=nav.querySelector('.active');active?.scrollIntoView?.({block:'nearest',inline:'nearest'});}
  function updateSimulator(){
    const {gdp,dep,tax,abroad}=state.sim;
    const results={gdp,ndpm:gdp-dep,ndpf:gdp-dep-tax,nif:gdp-dep-tax+abroad,nim:gdp-dep+abroad,gni:gdp+abroad};
    for(const [k,v]of Object.entries(results)){const el=document.getElementById('r-'+k);if(el)el.textContent=nfmt(v)}
    for(const [k,v]of Object.entries(state.sim)){const out=document.getElementById('output-'+k);if(out)out.textContent=nfmt(v)}
    const message=document.getElementById('simMessage');if(message)message.textContent=`GNI − GDP = ${nfmt(abroad)}。この差は「海外からの所得の純受取」と一致します。`;
  }
  function gradeQuiz(scroll=true){
    let correct=0;
    blanks.forEach(b=>{
      const row=document.getElementById(`row-${b.id}`),ex=document.getElementById(`explain-${b.id}`);
      if(!row||!ex)return;
      const val=state.blanks[b.id]||'';const okay=val===b.ans;if(okay)correct++;
      row.classList.remove('correct','wrong');row.classList.add(okay?'correct':'wrong');
      ex.textContent=okay?`✓ 正解。${b.why}`:`正解：${b.ans}。${b.why}`;
      ex.classList.toggle('bad',!okay);
    });
    state.graded=true;state.showSolutions=true;
    const card=document.getElementById('scoreCard');card?.classList.add('show');
    document.getElementById('scoreNum').textContent=`${correct} / 17 正解`;
    document.getElementById('scoreText').textContent=correct===17?'満点です！説明できるかも確かめてみましょう。':`正答率 ${Math.round(correct/17*100)}%。赤い枠の項目を確認してから、回答を変更して再採点してください。`;
    const button=document.getElementById('toggleSolutions');if(button)button.textContent='解説を表示中';
    save();updateMasterChart();updateTermGlossary();if(scroll)card?.scrollIntoView({behavior:'smooth',block:'center'});
  }
  function showSolutions(){
    state.showSolutions=true;
    blanks.forEach(b=>{const ex=document.getElementById(`explain-${b.id}`);if(ex){ex.textContent=`正解：${b.ans}。${b.why}`;ex.classList.remove('bad');}});
    const button=document.getElementById('toggleSolutions');if(button)button.textContent='解説を表示中';save();updateMasterChart();updateTermGlossary();
  }
  document.addEventListener('click',e=>{
    const finder=e.target.closest('[data-term-row]');if(finder){
      const row=document.querySelector('.master-line[data-row="'+finder.dataset.termRow+'"]');
      if(row){document.querySelectorAll('.master-line.word-linked').forEach(el=>el.classList.remove('word-linked'));row.classList.add('word-linked');row.scrollIntoView({behavior:'smooth',block:'center',inline:'nearest'});setTimeout(()=>row.classList.remove('word-linked'),2300)}
      return;
    }
    const chart=e.target.closest('[data-chart]');if(chart){diagramAction(chart.dataset.chart);return}
    const step=e.target.closest('[data-step]');if(step){go(Number(step.dataset.step));return}
    if(e.target.closest('#prevStep')){go(state.current-1);return}
    if(e.target.closest('#nextStep')){go(state.current===steps.length-1?0:state.current+1);return}
    const choice=e.target.closest('[data-choice]');if(choice){state.answers[state.current]=Number(choice.dataset.choice);save();render();return}
    if(e.target.closest('#resetSimulator')){state.sim={...defaults.sim};render();return}
    if(e.target.closest('#gradeQuiz')){gradeQuiz();return}
    if(e.target.closest('#toggleSolutions')){if(state.showSolutions){state.showSolutions=false;state.graded=false;render()}else showSolutions();return}
    if(e.target.closest('#resetQuiz')){state.blanks={};state.graded=false;state.showSolutions=false;render();return}
    if(e.target.closest('#openOriginal')){const d=document.getElementById('imageDialog'),pic=document.querySelector('.original-picture');if(d&&pic){const clone=pic.cloneNode(false);clone.removeAttribute('loading');document.getElementById('imageScroll').replaceChildren(clone);d.showModal()}return}
    if(e.target.closest('#closeOriginal')){document.getElementById('imageDialog')?.close();return}
  });
  document.addEventListener('input',e=>{
    const input=e.target.closest('[data-sim]');if(input){state.sim[input.dataset.sim]=Number(input.value);updateSimulator();save()}
  });
  document.addEventListener('change',e=>{
    const sel=e.target.closest('[data-blank]');if(sel){state.blanks[Number(sel.dataset.blank)]=sel.value;if(state.graded){state.graded=false;state.showSolutions=false;document.querySelectorAll('.quiz-row').forEach(r=>{r.classList.remove('correct','wrong');r.querySelector('.quiz-explain').textContent='' });document.getElementById('scoreCard')?.classList.remove('show');const b=document.getElementById('toggleSolutions');if(b)b.textContent='答えと解説を表示';}save()}
  });
  render();
})();
</script>
</body>
</html>
